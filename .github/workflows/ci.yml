name: CI

on:
  pull_request:
    branches:
      - develop
      - test
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar workspaces
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verificar paquetes
        run: npm run check:packages

      - name: Pruebas de servicios y gateway
        run: npm test
